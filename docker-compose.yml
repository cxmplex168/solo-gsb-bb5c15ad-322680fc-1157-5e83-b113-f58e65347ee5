services:
  merge-api:
    build: .
    image: three-way-merge-api:latest
    container_name: three-way-merge-api
    ports:
      - "8000:8000"
    environment:
      MERGE_DB_PATH: /data/merges.db
    volumes:
      - merge-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  merge-data:
